name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── ① 可移植性闸门（**干净 Linux 环境**；老板 2026-10-14 的三层验收层）──
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ⚠️ 不要写「|| pip install <一部分包>」这种兜底：它装出来的环境和 requirements.txt
          #    **不是同一个**，跑绿了不能说明任何事（2026-10-14 protobuf 就是这么漏的）。
          #    宁可让安装步骤响亮地失败；要抗网络抖动用 --retries。
          pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Hardcoded-value scan (must pass)
        run: python tools/check_portability.py
      - name: Env docs must match env_spec (no drift)
        run: python tools/gen_env_docs.py --check
      # ── 反私人定制（2026-10-15）：平台专属命令伪装成通用能力 / 开箱假数据 ──
      #    判据与六种形态见 PRODUCTIZATION.md
      - name: Productization scan (must pass)
        run: python tools/check_productization.py

  # ── ② 干净 Linux 上跑测试（"陌生环境能跑"的直接验收）──
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ⚠️ 不要写「|| pip install <一部分包>」这种兜底：它装出来的环境和 requirements.txt
          #    **不是同一个**，跑绿了不能说明任何事（2026-10-14 protobuf 就是这么漏的）。
          #    宁可让安装步骤响亮地失败；要抗网络抖动用 --retries。
          pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile check
        run: python -m compileall agent_community -q
      - name: Run agent_community tests
        run: python -m pytest agent_community/tests -q --no-header -p no:cacheprovider
      - name: Run root tests (offline subset)
        run: |
          python -m pytest tests/test_rule_gate.py tests/test_ai_cache.py tests/test_ai_usage.py \
            tests/test_reasoning_effort.py tests/test_provider_stack.py -q --no-header -p no:cacheprovider
      - name: Sensitive content scan
        run: python tests/scan_sensitive.py . --secrets-only
      # ── ★陌生人首次运行走查（2026-10-15）：判据＝换目录+换端口+换数据目录、不改一行代码 ──
      #    五步：clone → cli start --no-gui → cli task → cli task-result → cli stop，
      #    外加"仓库保持干净"与"错误不许是空原因"。判据见 PRODUCTIZATION.md。
      - name: First-run walkthrough (stranger path)
        run: python tools/first_run_check.py
      - name: 只改环境变量也能起（换端口 + 换数据目录）
        run: |
          AC_PORT=34567 AC_DATA_DIR=$RUNNER_TEMP/acdata python -m agent_community.platform.server &
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS "http://127.0.0.1:34567/api/status" | grep -q running; then
              echo "OK: 换端口 + 换数据目录后起来了"; exit 0
            fi
          done
          echo "FAIL: 端口/数据目录换掉后起不来"; exit 1

  # ── ③ Windows 上再跑一遍（本项目主开发环境；与 Linux 结果对齐）──
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ⚠️ 不要写「|| pip install <一部分包>」这种兜底：它装出来的环境和 requirements.txt
          #    **不是同一个**，跑绿了不能说明任何事（2026-10-14 protobuf 就是这么漏的）。
          #    宁可让安装步骤响亮地失败；要抗网络抖动用 --retries。
          pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile check
        run: |
          python -m compileall agent_community -q
          echo "All .py files compile OK"
      - name: Run agent_community tests
        run: |
          python -m pytest agent_community/tests -q --no-header -p no:cacheprovider
      - name: Run root tests (offline subset)
        run: |
          python -m pytest tests/test_rule_gate.py tests/test_ai_cache.py tests/test_ai_usage.py tests/test_reasoning_effort.py tests/test_provider_stack.py -q --no-header -p no:cacheprovider
      - name: Portability scan
        run: python tools/check_portability.py
      - name: Sensitive content scan
        run: |
          python tests/scan_sensitive.py . --secrets-only
