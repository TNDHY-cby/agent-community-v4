<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>监控室 · 画面墙</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="hub.css">
<style>
/* 本页只补 hub.css 没有的变量；CRT 皮肤令牌已退役（备份 theme-crt.css.bak_20261029） */
:root{--rule-strong:rgba(var(--accent-rgb),.45)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar b{letter-spacing:2px;font-size:14px}
.topbar .cnt{font-size:12px;color:var(--muted)}
.topbar .cnt b{color:var(--accent-strong);font-size:12px;letter-spacing:0}
.topbar .spacer{flex:1}
.topbar a{color:#00FFFF;text-decoration:none;font-size:12px}
.layout{flex:1;display:grid;grid-template-columns:320px 1fr;gap:0;overflow:hidden}
.col{overflow-y:auto;padding:12px;border-right:1px solid var(--rule)}
.col.right{border-right:none;border-left:1px solid var(--rule)}
.col h3{font-size:12px;letter-spacing:2px;color:var(--muted);margin-bottom:10px}
.acard{border:1px solid var(--rule);background:var(--bg3);padding:9px 11px;margin-bottom:9px}
.acard .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acard .name{font-weight:800;color:var(--ink)}
.acard .why{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.6;word-break:break-all}
.sw{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);cursor:pointer;user-select:none}
.sw i{width:26px;height:13px;border:1px solid var(--rule-strong);display:inline-block;position:relative}
.sw i::after{content:'';position:absolute;top:1px;left:1px;width:9px;height:9px;background:var(--dim)}
.sw.on i::after{left:14px;background:var(--accent);box-shadow:0 0 6px rgba(var(--accent-rgb),.6)}
.sw.on{color:var(--ink)}
.win-null{color:var(--dim);font-size:11px}
.win-no{color:var(--yellow);font-size:11px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:12px;overflow-y:auto}
.tile{border:1px solid var(--rule);background:var(--bg3);padding:8px;cursor:zoom-in}
.tile:hover{border-color:var(--rule-strong);box-shadow:0 0 8px rgba(255,0,0,.4)}
.tile img{width:100%;display:block;background:#000;min-height:120px;object-fit:contain}
.tile .tt{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px}
.tile .tt b{color:var(--ink)}
.stopped{font-size:11px;color:var(--dim);margin-top:4px}
.empty{padding:40px;text-align:center;color:var(--dim);font-size:12px}
.airow{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:11px;color:var(--muted)}
#zoomOv{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;flex-direction:column;gap:10px}
#zoomOv img{max-width:94vw;max-height:88vh;background:#000}
#zoomOv .cap{color:var(--muted);font-size:12px}
.err{color:var(--red);font-size:11px;margin-top:4px}

  /* ── 会话观察窗（D后端-71）：两种格子要一眼分得开 ── */
  .tag{font-size:10px;letter-spacing:1px;padding:1px 6px;border:1px solid var(--rule-strong);color:var(--muted)}
  .tag.window{color:var(--accent);border-color:rgba(var(--accent-rgb),.5)}
  .tag.session{color:#00FFFF;border-color:rgba(0,255,255,.45)}
  .tag.none{color:var(--dim);border-color:var(--rule)}
  .tile.kind-session{cursor:default;border-left:3px solid rgba(0,255,255,.45);background:#0b0d0d}
  .tile.kind-session:hover{box-shadow:none;border-color:var(--rule)}
  .sess-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .sess-head b{color:var(--ink);font-size:12.5px}
  .sess-meta{font-size:10.5px;color:var(--dim)}
  .sess-body{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
  .sm{font-size:11.5px;line-height:1.6;padding:5px 8px;border-left:2px solid var(--rule);background:rgba(255,255,255,.02)}
  .sm .who{font-size:10px;letter-spacing:1px;color:var(--dim);display:block;margin-bottom:2px}
  .sm.user{border-left-color:var(--muted)}
  .sm.assistant{border-left-color:rgba(0,255,255,.5)}
  .sm .tx{word-break:break-word;white-space:pre-wrap;color:var(--ink)}
  .sess-why{color:var(--yellow);font-size:11.5px;line-height:1.7;word-break:break-word}
  .sess-note{margin-top:6px;font-size:10.5px;line-height:1.6;color:var(--dim);border-top:1px dashed var(--rule);padding-top:5px}
  .sess-caution{margin-top:5px;font-size:10.5px;line-height:1.6;color:var(--yellow)}
  .sess-btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .sess-btns button{background:transparent;border:1px solid var(--rule-strong);color:var(--muted);
    font-family:inherit;font-size:10.5px;padding:2px 8px;cursor:pointer}
  .sess-btns button:hover{color:var(--ink);border-color:var(--rule-strong)}
  .tri{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
  .tri span{font-size:10.5px;padding:1px 6px;border:1px solid var(--rule);color:var(--muted)}
  .tri .unv{color:var(--yellow);border-color:rgba(224,160,74,.4)}
  .tri .ver{color:var(--green);border-color:rgba(143,179,155,.4)}
  .tri-note{font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.6;word-break:break-word}
</style>
<link rel="stylesheet" href="chrome.css">
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="industrial.css">
</head>
<body class="">
<header class="topbar chrome-top chrome-fixed">
  <div class="logo"><span class="logo-mark">▣</span> 监控室<span class="sub">· 画面墙</span></div>
  <div class="position">正在看 <b id="mCount">0</b> / 上限 <b id="mMax">–</b>　<span id="mHealth"></span></div>
  <div class="spacer"></div>
  <button class="btn mech" onclick="monRefresh()" title="重新扫描可开画面">⟳ 刷新</button>
  <nav class="live-links">
      <a href="/docking.html" title="对接中心 · 把外面的 agent 接进来">对接中心</a>
      <a href="/">实时大厅</a>
    <a href="/workshop.html">工作间</a>
    </nav>
</header>
<div class="airow" style="padding:0 16px;border-bottom:1px solid var(--rule)">
  <span>AI 观察（默认关；开了也由后端限频，至少 30 分钟一次——本页不每帧触发）：</span>
  <label class="sw" id="aiSw"><i></i>关</label>
  <span id="aiNote" class="win-null"></span>
</div>
<div class="layout">
  <div class="col">
    <h3>候选（能看画面 / 能看会话 / 都看不了——为什么）</h3>
    <div id="agentsList"><div class="empty">加载中…</div></div>
  </div>
  <div class="col right">
    <h3>监控墙（画面快照 1 帧/秒 + 会话观察窗 · 点画面放大）</h3>
    <div id="wall" class="wall"><div class="empty">还没开任何一路——在左侧把开关打开。</div></div>
  </div>
</div>
<div id="zoomOv" onclick="if(event.target===this)monZoomClose()">
  <img id="zoomImg" alt=""><div class="cap" id="zoomCap">点击任意处关闭</div></div>
<script src="monitor.js"></script>
<script src="chrome.js" defer></script>
</body>
</html>
