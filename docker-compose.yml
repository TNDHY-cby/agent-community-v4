# 外端Agent生产合作社（External Agent Community）· 一键起（陌生机器只改环境变量）
#
#   cp .env.example .env      # 想改端口/数据目录/服务商就改这里，别改代码
#   docker compose up -d
#   open http://127.0.0.1:${AC_PORT:-18920}/
#
# 为什么这样写：端口、数据目录、AI 服务商**全部来自环境变量**（见 PORTABILITY.md）。
services:
  platform:
    build: .
    image: agent-community:local
    container_name: agent-community
    env_file:
      - path: .env
        required: false          # 没建 .env 也能起（全部有默认值）
    environment:
      # 这三个是"照抄也不会错"的默认；要改请在 .env 里改
      AC_PORT: "${AC_PORT:-18920}"
      AC_HOST: "${AC_HOST:-0.0.0.0}"
      AC_DATA_DIR: "/data"
      AC_ENV: "${AC_ENV:-}"
    ports:
      - "${AC_PORT:-18920}:${AC_PORT:-18920}"
    volumes:
      - ac-data:/data
    restart: unless-stopped

volumes:
  ac-data:
