# 外端Agent生产合作社（External Agent Community）· 一键起（陌生机器只改环境变量）
#
#   cp .env.example .env      # 想改端口/数据目录/服务商就改这里，别改代码
#   docker compose up -d
#
# ⚠️⚠️ **浏览器界面在"端口映射"下用不了 —— 这是有意的安全边界，不是 bug**：
#   平台的认证口径是「**本机免 token、非本机必带 token**」（见 README 安全说明）。
#   而用了 `ports:` 映射时，宿主浏览器发来的请求在容器里看到的来源是 **docker 网关**
#   （不是 127.0.0.1）⇒ **一定走"非本机"分支**，于是分两档（2026-10-15 真机走查实测）：
#     · 容器里**没配置** `AC4_TOKEN` ⇒ **HTTP 403「服务未配置访问 Token」**（本条原文那句）；
#     · 容器里**配置了** `AC4_TOKEN` ⇒ 不带令牌 **HTTP 401「需要有效的 Token 认证…」**，
#       带对的令牌 **HTTP 200**。这两档的差别本身就是"令牌有没有被读到"的可观测证据。
#   两档都由守卫 `agent_community/tests/test_ac4_token_env.py` 钉住。
#   当前**前端界面还没有令牌通道**（只有公司间 A2A 令牌），所以：
#     ① 只想用命令行 / API：在 `.env` 里设 `AC4_TOKEN=<你的令牌>`，
#        请求带 `Authorization: Bearer <令牌>`（或 `X-API-Key` / `?token=`）；
#     ② 想在浏览器里用界面（**Linux 宿主**）：把下面的 `ports:` 删掉，
#        改用 `network_mode: host` —— 容器直接占 `AC_PORT`，
#        浏览器访问 `http://127.0.0.1:<AC_PORT>/` 就是"本机请求"，免令牌即可；
#     ③ Windows/macOS 的 Docker Desktop：host 网络支持依版本而异，**本项目未验证**，
#        请优先用 ① 或用源码方式跑（README《快速开始》那条路是本项目的主路径）。
#
# 为什么这样写：端口、数据目录、AI 服务商**全部来自环境变量**（见 PORTABILITY.md）。
services:
  platform:
    build: .
    image: agent-community:local
    container_name: agent-community
    env_file:
      - path: .env
        required: false          # 没建 .env 也能起（全部有默认值）
    environment:
      # 这三个是"照抄也不会错"的默认；要改请在 .env 里改
      AC_PORT: "${AC_PORT:-18920}"
      AC_HOST: "${AC_HOST:-0.0.0.0}"
      AC_DATA_DIR: "/data"
      AC_ENV: "${AC_ENV:-}"
      # 见上面 ①：端口映射下要用 API 就必须给令牌（留空 = 只有容器内 / host 网络能用）
      AC4_TOKEN: "${AC4_TOKEN:-}"
    ports:
      - "${AC_PORT:-18920}:${AC_PORT:-18920}"
    volumes:
      - ac-data:/data
    restart: unless-stopped

volumes:
  ac-data:
