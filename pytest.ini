; pytest 配置（2026-10-12 新增）
;
; ★为什么要有这个文件：本仓库的测试**分两处**：
;     · agent_community/tests/  —— 主线回归（1200+ 条）
;     · tests/                  —— 安全回归 / 缓存 / 用量 / provider 栈 / 规则闸门（66 条）
;   此前**没有根级配置**，于是"跑全量"要靠人记得传对路径 ——
;   我连续多日只跑 `pytest agent_community/tests`，**`tests/` 那 66 条一直没被跑过**，
;   对外却报"全量 0 failed"。这正是本项目最反对的"看起来成功"（准则⑤ / 规则 20）。
;   ⇒ 把两处写进 `testpaths`：**裸 `pytest` 即覆盖全部**，谁都不用记路径。
;
; 另：`tests/security_regression.py` 里有一组**故障注入**用例，**故意断言失败**
;   以证明断言真的有效；它由 `--run-fault-injection` 开关控制、**默认不跑**。
;   所以"全绿"是指不开这个开关时的结果 —— 这是有意的，不是漏测。

[pytest]
testpaths = agent_community/tests tests
addopts = -q
